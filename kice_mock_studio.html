<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수능관 & 전국학평 & 세종내신 기출 보관소 · 1초 AI 쌍둥이 스튜디오</title>
<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  --primary: #1d4ed8;
  --primary-dark: #1e40af;
  --cyan-active: #0e7490;
  --cyan-border: #22d3ee;
  --dark-btn-bg: #18233d;
  --dark-btn-border: #2b3a5e;
  --card-bg: #ffffff;
  --border-line: #e2e8f0;
  --tx-main: #0f172a;
  --tx-muted: #64748b;
  --bg-page: #f8fafc;
  --num-blue: #1e3a8a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  background: var(--bg-page);
  color: var(--tx-main);
  line-height: 1.65;
  padding-bottom: 80px;
}

/* 상단 통합 헤더 */
header {
  background: #ffffff;
  border-bottom: 1px solid var(--border-line);
  padding: 14px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.header-wrap {
  max-width: 1140px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-badge {
  background: #1d4ed8;
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 6px;
  letter-spacing: 0.5px;
}
.brand-title {
  font-size: 18px;
  font-weight: 800;
  color: #0f172a;
}
.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.act-btn {
  font-size: 13px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--border-line);
  background: #ffffff;
  color: #334155;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  transition: all 0.15s ease;
}
.act-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
.act-btn.primary { background: #1d4ed8; color: #ffffff; border-color: #1d4ed8; }
.act-btn.primary:hover { background: #1e40af; }
.act-btn.accent { background: #059669; color: #ffffff; border-color: #059669; }
.act-btn.accent:hover { background: #047857; }

/* 메인 컨테이너 */
.container {
  max-width: 1140px;
  margin: 24px auto;
  padding: 0 18px;
}

/* 안내 배너 */
.notice-box {
  background: #111e38;
  border: 1px solid #1e293b;
  border-radius: 14px;
  padding: 16px 20px;
  color: #94a3b8;
  font-size: 13.5px;
  line-height: 1.6;
  margin-bottom: 20px;
}
.notice-box b { color: #38bdf8; }

/* 학년/카테고리 탭 */
.cat-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.cat-tab {
  font-size: 14.5px;
  font-weight: 700;
  padding: 9px 20px;
  border-radius: 9999px;
  background: #ffffff;
  border: 1.5px solid #cbd5e1;
  color: #475569;
  cursor: pointer;
  transition: all 0.15s;
}
.cat-tab:hover { border-color: #94a3b8; background: #f8fafc; }
.cat-tab.active {
  background: #0f172a;
  border-color: #0f172a;
  color: #ffffff;
  box-shadow: 0 3px 10px rgba(15,23,42,0.15);
}

/* 1번 사진 완벽 구현: 연도/시험 선택 알약 버튼 바 */
.year-bar-card {
  background: #0b1329;
  border: 1px solid #1e293b;
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 24px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.year-bar-title {
  color: #38bdf8;
  font-size: 12.5px;
  font-weight: 800;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.year-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
/* 1번 사진 버튼 스타일 */
.year-btn {
  font-family: inherit;
  font-weight: 800;
  font-size: 15px;
  color: #e2e8f0;
  background: #18233d;
  border: 1.5px solid #2b3a5e;
  border-radius: 12px;
  padding: 10px 20px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  letter-spacing: -0.2px;
}
.year-btn:hover {
  border-color: #38bdf8;
  background: #1e2e50;
  color: #ffffff;
}
.year-btn.active {
  background: #0e7490 !important;
  border-color: #22d3ee !important;
  color: #ffffff !important;
  box-shadow: 0 0 16px rgba(34, 211, 238, 0.45);
}
.year-btn .cnt {
  font-size: 12.5px;
  font-weight: 600;
  color: #94a3b8;
}
.year-btn.active .cnt {
  color: #cffafe;
}

/* 문항 카드 목록 */
.q-list {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* 2번 사진 완벽 구현: 문항 카드 */
.q-card {
  background: #ffffff;
  border: 1.5px solid #e2e8f0;
  border-radius: 18px;
  padding: 26px 28px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.03);
  transition: border-color 0.2s;
  position: relative;
}
.q-card:hover {
  border-color: #93c5fd;
}

/* 카드 상단: 번호 박스 + 출처 태그 + 4종 알약 버튼 */
.q-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px dashed #e2e8f0;
}
.q-identity {
  display: flex;
  align-items: center;
  gap: 12px;
}
/* 사진 2번 번호 스타일: 볼드 넘버 50 */
.q-num {
  font-size: 32px;
  font-weight: 900;
  color: #1e3a8a;
  line-height: 1;
  letter-spacing: -1px;
}
/* 출처 태그 박스 */
.q-tag {
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 700;
  color: #334155;
  letter-spacing: -0.2px;
}
.q-diff {
  font-size: 12px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
}
.diff-4 { background: #fee2e2; color: #b91c1c; }
.diff-3 { background: #fef3c7; color: #b45309; }
.diff-2 { background: #ecfdf5; color: #047857; }

/* 2번 사진 알약형(Pill) 툴바 4종 */
.q-pills {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.pill-btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 7px 15px;
  border-radius: 9999px;
  border: 1.5px solid;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #ffffff;
  transition: all 0.15s ease;
  user-select: none;
}
/* 👣 힌트 풀이 */
.pill-hint {
  border-color: #e9d5ff;
  color: #6b21a8;
  background: #faf5ff;
}
.pill-hint:hover, .pill-hint.active {
  background: #f3e8ff;
  border-color: #c084fc;
  box-shadow: 0 2px 8px rgba(192, 132, 252, 0.25);
}
/* ✍️ 손글씨 */
.pill-draw {
  border-color: #fed7aa;
  color: #c2410c;
  background: #fff7ed;
}
.pill-draw:hover, .pill-draw.active {
  background: #ffedd5;
  border-color: #fb923c;
  box-shadow: 0 2px 8px rgba(251, 146, 60, 0.25);
}
/* ⚡ 쌍둥이 4제 */
.pill-twin {
  border-color: #bbf7d0;
  color: #15803d;
  background: #f0fdf4;
}
.pill-twin:hover, .pill-twin.active {
  background: #dcfce7;
  border-color: #4ade80;
  box-shadow: 0 2px 8px rgba(74, 222, 128, 0.25);
}
/* 📋 복사 */
.pill-copy {
  border-color: #e2e8f0;
  color: #475569;
  background: #ffffff;
}
.pill-copy:hover {
  background: #f1f5f9;
  border-color: #cbd5e1;
}

/* 문항 본문 */
.q-body {
  font-size: 16.5px;
  line-height: 1.85;
  color: #1e293b;
  margin-bottom: 20px;
}
.q-table-box {
  margin: 16px 0;
  overflow-x: auto;
}
.kice-table {
  border-collapse: collapse;
  width: 100%;
  max-width: 580px;
  margin: 8px 0;
  font-size: 15px;
  background: #ffffff;
  border: 1.5px solid #cbd5e1;
  text-align: center;
}
.kice-table th, .kice-table td {
  border: 1px solid #cbd5e1;
  padding: 10px 14px;
}
.kice-table th {
  background: #f8fafc;
  font-weight: 700;
  color: #334155;
}
.kice-table .hl-sweep {
  background: #fef08a !important; /* 파스텔 레몬 옐로우 */
  transition: background 0.4s ease;
}
.kice-table .hl-ring {
  background: #fce7f3 !important;
  outline: 3px solid #ec4899;
  outline-offset: -2px;
  font-weight: 900;
  color: #be185d;
}

/* 객관식 보기 */
.q-choices {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin: 16px 0;
  padding: 12px;
  background: #f8fafc;
  border-radius: 10px;
  border: 1px solid #f1f5f9;
  font-size: 15px;
}
@media (max-width: 680px) {
  .q-choices { grid-template-columns: 1fr; }
}

/* 인터랙티브 시뮬레이터 캔버스 컨테이너 */
.sim-wrap {
  margin: 16px 0;
  padding: 16px;
  background: #0f172a;
  border-radius: 14px;
  border: 1px solid #1e293b;
  color: #ffffff;
}
.sim-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.sim-title {
  font-size: 13.5px;
  font-weight: 800;
  color: #38bdf8;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sim-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}
.sim-btn {
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
  background: #1e293b;
  color: #cbd5e1;
  border: 1px solid #334155;
  cursor: pointer;
}
.sim-btn:hover { background: #334155; color: #fff; }
.sim-canvas {
  width: 100%;
  height: 240px;
  background: #020617;
  border-radius: 10px;
  display: block;
}

/* 손글씨 캔버스 영역 (토글) */
.draw-area {
  display: none;
  margin: 16px 0;
  padding: 14px;
  background: #fffbeb;
  border: 1.5px solid #fde68a;
  border-radius: 14px;
}
.draw-area.show { display: block; }
.draw-tools {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.draw-tools span { font-size: 12px; font-weight: 700; color: #92400e; }
.draw-tools button {
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid #d97706;
  background: #ffffff;
  cursor: pointer;
}
.hand-canvas {
  width: 100%;
  height: 220px;
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  touch-action: none;
  cursor: crosshair;
  display: block;
}

/* 👣 힌트 풀이 단계별 박스 (토글) */
.hint-panel {
  display: none;
  margin-top: 18px;
  padding: 20px;
  background: #faf5ff;
  border: 1.5px solid #e9d5ff;
  border-radius: 14px;
}
.hint-panel.show { display: block; }
.hint-title {
  font-size: 14.5px;
  font-weight: 800;
  color: #7e22ce;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.step-item {
  background: #ffffff;
  border: 1px solid #f3e8ff;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.step-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 800;
  color: #6b21a8;
  margin-bottom: 6px;
}
.step-badge {
  background: #8b5cf6;
  color: #fff;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 4px;
}
.step-body {
  font-size: 14.5px;
  line-height: 1.7;
  color: #334155;
}
.ans-box {
  background: #ede9fe;
  border: 1px solid #c4b5fd;
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 12px;
  font-size: 15px;
  font-weight: 800;
  color: #5b21b6;
}

/* ⚡ 쌍둥이 4제 영역 (토글) */
.twins-panel {
  display: none;
  margin-top: 18px;
  padding: 20px;
  background: #f0fdf4;
  border: 1.5px solid #bbf7d0;
  border-radius: 14px;
}
.twins-panel.show { display: block; }
.twins-head {
  font-size: 15px;
  font-weight: 800;
  color: #15803d;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.twins-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media (max-width: 820px) {
  .twins-grid { grid-template-columns: 1fr; }
}
.twin-card {
  background: #ffffff;
  border: 1px solid #86efac;
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
}
.twin-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 800;
  color: #166534;
  margin-bottom: 8px;
}
.twin-badge {
  background: #22c55e;
  color: #ffffff;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 11px;
}
.twin-body {
  font-size: 14.5px;
  line-height: 1.7;
  color: #1e293b;
  margin-bottom: 12px;
}
.twin-sol-btn {
  margin-top: auto;
  align-self: flex-start;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 6px;
  border: 1px solid #cbd5e1;
  background: #f8fafc;
  color: #475569;
  cursor: pointer;
}
.twin-sol-body {
  display: none;
  margin-top: 8px;
  padding: 10px;
  background: #f8fafc;
  border-radius: 8px;
  font-size: 13.5px;
  line-height: 1.6;
  border-left: 3px solid #16a34a;
}
.twin-sol-body.show { display: block; }

/* 수능형 2열 A4 인쇄 스타일 */
@media print {
  header, .cat-tabs, .year-bar-card, .notice-box, .q-pills, .draw-area, .sim-controls, .sim-btn {
    display: none !important;
  }
  body { background: #ffffff; padding: 0; }
  .container { max-width: 100%; margin: 0; padding: 0; }
  .q-list {
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .q-card {
    border: 1px solid #cbd5e1;
    page-break-inside: avoid;
    box-shadow: none;
    padding: 16px;
  }
  .hint-panel, .twins-panel { display: none !important; }
}
</style>
</head>
<body>

<header>
  <div class="header-wrap">
    <div class="brand">
      <span class="brand-badge">GMS AI</span>
      <h1 class="brand-title">기출문제 보관소 & 1초 AI 쌍둥이 스튜디오</h1>
    </div>
    <div class="header-actions">
      <button class="act-btn" onclick="openRegisterModal()">➕ 기출 직접 등록</button>
      <button class="act-btn primary" onclick="window.print()">🖨️ A4 2단 시험지 인쇄</button>
      <button class="act-btn accent" onclick="extractAllTwins()">⚡ 전 문항 쌍둥이 일괄 추출</button>
      <a href="../workbook.html" class="act-btn">← 문제집 복귀</a>
    </div>
  </div>
</header>

<main class="container">

  <!-- 상단 학년 및 출처 대분류 탭 -->
  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" onclick="switchCategory('suneung')">🎓 고3 · 수능 / 모의평가</button>
    <button class="cat-tab" onclick="switchCategory('mock_g2')">📘 고2 · 전국연합 학력평가</button>
    <button class="cat-tab" onclick="switchCategory('mock_g1')">📗 고1 · 전국연합 학력평가</button>
    <button class="cat-tab" onclick="switchCategory('sejong')">🏫 세종 내신 기출 (F:\ 24~25년)</button>
  </div>

  <!-- 안내 힌트 -->
  <div class="notice-box">
    💡 <b>연도 알약 버튼</b>을 누르면 해당 시험의 전 문항이 <b>[👣 힌트 풀이] · [✍️ 손글씨] · [⚡ 쌍둥이 4제] · [📋 복사]</b> 알약 툴바와 함께 즉시 펼쳐집니다.<br>
    공식 기출 텍스트와 완벽 대응하는 <b>4배수 자작 쌍둥이 변형</b>을 1클릭으로 추출하여 교사용 클리닉 시험지로 즉시 인쇄할 수 있습니다.
  </div>

  <!-- 1번 사진 완벽 구현: 연도/시험 선택 바 -->
  <div class="year-bar-card">
    <div class="year-bar-title">
      <span id="yearBarLabel">선택된 시험 연도</span>
      <span style="color:#64748b;font-weight:600;font-size:11.5px">공교육 기출 & 1:1 완벽 대응 자작 쌍둥이 탑재</span>
    </div>
    <div class="year-buttons" id="yearButtons">
      <!-- 동적 렌더링 -->
    </div>
  </div>

  <!-- 문항 목록 영역 -->
  <div class="q-list" id="qList">
    <!-- 문항 카드들이 동적으로 생성됨 -->
  </div>

</main>

<script>
// ==================== 데이터베이스 ====================
const DB = {
  // 1. 고3 수능 / 평가원
  suneung: {
    label: "고3 · 대학수학능력시험 및 모의평가",
    exams: [
      { id: "s2025", name: "2025학년도", cnt: "46문항" },
      { id: "s2024", name: "2024학년도", cnt: "46문항" },
      { id: "s2023", name: "2023학년도", cnt: "46문항" },
      { id: "s2022", name: "2022학년도", cnt: "46문항" },
      { id: "kice_legend", name: "평가원 레전드 50제", cnt: "50문항" }
    ],
    items: {
      s2025: [
        {

          subject: "수학Ⅱ · 속도와 가속도",
          body: `시각 $t=0$ 일 때 원점을 출발하여 수직선 위를 움직이는 점 $\\mathrm{P}$ 의 시각 $t\\,(t \\ge 0)$에서의 속도 $v(t)$ 가
$$v(t) = 3t^2 + at - 6$$
이다. $t=2$ 에서 점 $\\mathrm{P}$ 의 운동 방향이 바뀔 때, 시각 $t=2$ 에서 점 $\\mathrm{P}$ 의 가속도를 구하시오. (단, $a$ 는 상수이다.)`,
          choices: ["① 6", "② 9", "③ 12", "④ 15", "⑤ 18"],
          hasSim: "accel",
          steps: [
            { title: "운동 방향이 바뀔 조건", text: "점 $\\mathrm{P}$ 의 운동 방향이 바뀔 때 속도는 $0$ 입니다. 즉 $v(2) = 0$." },
            { title: "상수 a 구하기", text: "$v(2) = 3(2)^2 + a(2) - 6 = 12 + 2a - 6 = 2a + 6 = 0 \\implies a = -3$." },
            { title: "가속도 a(t) 계산", text: "가속도는 속도의 도함수이므로 $a(t) = v'(t) = 6t + a = 6t - 3$.<br>따라서 $t=2$ 일 때의 가속도는 $a(2) = 6(2) - 3 = 12 - 3 = 9$." }
          ],
          ans: "정답: ② 9",
          twins: [
            { title: "쌍둥이 1 (수치 변형)", badge: "변형 1", body: "속도 $v(t) = 3t^2 + at - 12$ 이고 $t=2$ 에서 운동 방향이 바뀔 때, $t=2$ 에서의 가속도를 구하시오.", sol: "$v(2) = 12 + 2a - 12 = 0 \\implies a=0$. 가속도 $a(t) = 6t \\implies a(2) = 12$." },
            { title: "쌍둥이 2 (시각 변경)", badge: "변형 2", body: "속도 $v(t) = 3t^2 - 12t + b$ 이고 $t=1$ 에서 운동 방향이 바뀔 때, $t=3$ 에서의 가속도를 구하시오.", sol: "$v(1) = 3 - 12 + b = 0 \\implies b=9$. $a(t) = 6t - 12 \\implies a(3) = 18 - 12 = 6$." },
            { title: "쌍둥이 3 (가속도 역추적)", badge: "변형 3", body: "$t=2$ 에서 가속도가 $10$ 이고 $t=1$ 에서 운동 방향이 바뀔 때의 속도 함수 $v(t) = 3t^2 + at + b$ 에서 $b$ 의 값을 구하시오.", sol: "$a(t) = 6t + a \\implies a(2) = 12+a = 10 \\implies a=-2$. $v(1) = 3 - 2 + b = 0 \\implies b=-1$." },
            { title: "쌍둥이 4 (위치·거리 확장)", badge: "변형 4", body: "속도 $v(t) = 3t^2 - 3t - 6$ 일 때, $t=0$ 부터 운동 방향이 바뀌는 시각까지 점 $\\mathrm{P}$ 가 움직인 거리를 구하시오.", sol: "$3(t^2-t-2) = 3(t-2)(t+1) = 0 \\implies t=2$. 움직인 거리 $\\int_0^2 |3t^2-3t-6|\\,dt = 10$." }
          ]
        },
        {

          tag: "2025학년도 대학수학능력시험 13번",
          diff: 4,
          subject: "수학Ⅱ · 정적분의 활용",
          body: `삼차함수 $f(x) = \\frac{1}{9}x(x-3)^2$ 과 양의 실수 $m$ 에 대하여 곡선 $y=f(x)$ 와 직선 $y=mx$ 로 둘러싸인 두 부분 중 원점의 오른쪽 첫 번째 영역의 넓이를 $S_1$, 두 번째 영역의 넓이를 $S_2$ 라 하자. $S_1 = S_2$ 일 때, 상수 $m$ 의 값은?`,
          choices: ["① 1/9", "② 2/9", "③ 1/3", "④ 4/9", "⑤ 5/9"],
          hasSim: "cubic_area",
          steps: [
            { title: "넓이가 같을 조건", text: "두 영역의 넓이가 같으므로, $x=0$ 부터 교점의 끝점까지의 정적분 값이 $0$ 이 됩니다." },
            { title: "삼차함수 대칭점 활용", text: "삼차함수와 직선이 만드는 두 영역의 넓이가 같으려면, 직선이 삼차곡선의 변곡점을 지나야 합니다." },
            { title: "변곡점 및 기울기 도출", text: "$f(x) = \\frac{1}{9}(x^3 - 6x^2 + 9x)$, $f'(x) = \\frac{1}{9}(3x^2 - 12x + 9)$, $f''(x) = \\frac{1}{9}(6x - 12) = 0 \\implies x=2$.<br>변곡점 $(2, f(2)) = (2, 2/9)$ 를 원점을 지나는 직선 $y=mx$ 가 지나므로 $m = \\frac{2/9}{2} = \\frac{1}{9}$." }
          ],
          ans: "정답: ① 1/9",
          twins: [
            { title: "쌍둥이 1 (스케일 변형)", badge: "변형 1", body: "곡선 $f(x) = x(x-6)^2$ 과 직선 $y=mx$ 로 둘러싸인 두 넓이가 같을 때 $m$ 의 값을 구하시오.", sol: "변곡점 $x=4$, $f(4) = 4(4-6)^2 = 16$. $m = 16/4 = 4$." },
            { title: "쌍둥이 2 (직선 평행이동)", badge: "변형 2", body: "곡선 $f(x) = x^3 - 3x$ 와 직선 $y=k$ 가 둘러싸인 두 부분의 넓이가 같도록 하는 $k$ 의 값을 구하시오.", sol: "원점 대칭이므로 $k=0$." },
            { title: "쌍둥이 3 (넓이 차이)", badge: "변형 3", body: "$f(x) = x(x-3)^2$ 과 $x$축 사이의 두 극값 영역 넓이 비율을 구하시오.", sol: "삼차함수 비율관계에 의해 넓이 비 $1:3$ 계산." },
            { title: "쌍둥이 4 (사차함수 확장)", badge: "변형 4", body: "사차함수 $g(x) = (x^2-1)^2$ 과 직선 $y=c$ 가 만드는 세 영역의 넓이 대칭성 연구", sol: "우함수 성질을 이용한 정적분 $0$ 조건." }
          ]
        }

            { title: "Step 2: 해당 사건의 인원 파악", text: "여학생 130명 중 '2학년'인 학생의 수는 표에서 <b>70명</b>입니다. (70명 셀에 로즈핑크 링 마킹)" },

            { title: "변형 2 (1학년 중 여학생)", badge: "변형 2", body: "선택한 한 명이 <b>1학년일 때</b>, 이 학생이 <b>여학생일 확률</b>을 구하시오.", sol: "$P(여학생 | 1학년) = \\frac{60}{140} = \\frac{3}{7}$." },
            { title: "변형 3 (2학년 중 남학생)", badge: "변형 3", body: "선택한 한 명이 <b>2학년일 때</b>, 이 학생이 <b>남학생일 확률</b>을 구하시오.", sol: "$P(남학생 | 2학년) = \\frac{90}{160} = \\frac{9}{16}$." },
            { title: "변형 4 (소재 확장형)", badge: "변형 4", body: "동아리 부원 200명 중 AI반 80명(남 50, 여 30), 코딩반 120명(남 70, 여 50)일 때, 남학생 중 AI반일 확률을 구하시오.", sol: "전체 남학생 $50+70=120$명 중 AI반 50명이므로 $50/120 = 5/12$." }

          tag: "2025년 고운고 1-1 중간 10번 [F드라이브]",
          diff: 4,
          subject: "공통수학1 · 복소수의 주기성",
          body: `복소수 $z = \\frac{2+i}{1-2i}$ 일 때,
$$1 + z + z^2 + z^3 + \\cdots + z^{2025}$$
의 값을 구하시오. (단, $i = \\sqrt{-1}$ 이다.)`,
          choices: ["① 0", "② 1", "③ 1+i", "④ -i", "⑤ 1-i"],
          hasSim: "complex_unit",
          steps: [
            { title: "Step 1: z의 분모 실수화", text: "$z = \\frac{(2+i)(1+2i)}{(1-2i)(1+2i)} = \\frac{2 + 4i + i + 2i^2}{1 - 4i^2} = \\frac{5i}{5} = i$." },
            { title: "Step 2: i의 거듭제곱 4주기성 파악", text: "$1 + i + i^2 + i^3 = 1 + i - 1 - i = 0$. 즉 연속된 4개 항의 합은 항상 $0$ 입니다." },
            { title: "Step 3: 총 항의 개수와 나머지 계산", text: "$z^0$ 부터 $z^{2025}$ 까지 총 $2026$ 개의 항이 존재합니다.<br>$2026 = 4 \\times 506 + 2$ 이므로 앞의 2개 항만 남습니다.<br>$$\\text{값} = 1 + z = 1 + i$$" }
          ],
          ans: "정답: ③ 1+i",
          twins: [
            { title: "변형 1 (부호 변형)", badge: "변형 1", body: "$z = \\frac{1-2i}{2+i}$ 일 때, $1 + z + z^2 + \\cdots + z^{2025}$ 의 값을 구하시오.", sol: "$z = -i$. $2026$개 항이므로 $1 + (-i) = 1-i$." },
            { title: "변형 2 (지수 변경)", badge: "변형 2", body: "$z = \\frac{2+i}{1-2i} = i$ 일 때, $z + z^2 + z^3 + \\cdots + z^{2024}$ 의 값을 구하시오.", sol: "총 $2024$개 항 ($4$의 배수)이므로 합은 $0$." },
            { title: "변형 3 (계수 곱형)", badge: "변형 3", body: "$i + 2i^2 + 3i^3 + 4i^4 + \\cdots + 20i^{20}$ 의 값을 구하시오.", sol: "4개씩 묶음: $(i - 2 - 3i + 4) = 2 - 2i$. 5개 묶음이므로 $5(2-2i) = 10 - 10i$." },
            { title: "변형 4 (오메가 확장)", badge: "변형 4", body: "$\\omega = \\frac{-1+\\sqrt{3}i}{2}$ 일 때, $1 + \\omega + \\omega^2 + \\cdots + \\omega^{2025}$ 의 값을 구하시오.", sol: "$\\omega^3 = 1, 1+\\omega+\\omega^2=0$. 2026개 항은 $3\\times 675 + 1$ 이므로 답은 1." }
          ]

        {

          body: `실수 $x$ 의 값의 범위가 $-1 \\le x \\le 3$ 일 때, 이차함수

          hasSim: "parabola_range",
          steps: [
            { title: "Step 1: 표준형 변형", text: "$y = -(x^2 - 4x + 4) + 4 - 5 = -(x-2)^2 - 1$." },
            { title: "Step 2: 대칭축과 꼭짓점 확인", text: "대칭축 $x=2$ 는 주어진 구간 $[-1, 3]$ 내에 포함됩니다. 위로 볼록하므로 최댓값은 꼭짓점인 $x=2$ 에서 $M = -1$." },
            { title: "Step 3: 최솟값(축에서 가장 먼 경계) 확인", text: "축 $x=2$ 에서 거리가 더 먼 경계는 $x=-1$ (거리 3 vs 거리 1).<br>$x=-1$ 대입: $m = -(-1-2)^2 - 1 = -9 - 1 = -10$." },
            { title: "Step 4: 합 계산", text: "$$M + m = (-1) + (-10) = -11$$" }
          ],

            { title: "변형 2 (구간 이동)", badge: "변형 2", body: "$0 \\le x \\le 5$ 에서 $y = -(x-3)^2 + 8$ 의 최댓값과 최솟값의 합을 구하시오.", sol: "최댓값 $x=3$ 에서 $8$, 최솟값 $x=0$ 에서 $-1$. 합은 $7$." },
            { title: "변형 3 (최댓값 차이)", badge: "변형 3", body: "$-2 \\le x \\le 2$ 에서 $y = -2x^2 + 4x + 3$ 의 최댓값과 최솟값의 차 $(M-m)$ 을 구하시오.", sol: "축 $x=1$ 에서 $M=5$, $x=-2$ 에서 $m=-13$. $M-m = 18$." },
            { title: "변형 4 (미정계수형)", badge: "변형 4", body: "$1 \\le x \\le 4$ 에서 $y = -x^2 + 2ax + 3$ 의 최댓값이 $12$ 일 때 양수 $a$ 의 값을 구하시오.", sol: "축의 위치에 따른 케이스 분류 및 해 도출." }
          ]
        },
        {
          num: 3,
          tag: "2025년 다정고 1-1 중간 7번 [F드라이브]",
          diff: 3,
          subject: "공통수학1 · 이차함수와 직선의 위치관계",
          body: `이차함수 $y = 3x^2 - x + 1$ 의 그래프와 직선 $y = 2x + k$ 가 서로 다른 두 점에서 만나도록 하는 실수 $k$ 의 값의 범위를 구하시오.`,

          steps: [
            { title: "Step 1: 연립방정식 작성", text: "$3x^2 - x + 1 = 2x + k \\iff 3x^2 - 3x + (1-k) = 0$." },
            { title: "Step 2: 판별식 D 적용", text: "서로 다른 두 점에서 만나므로 판별식 $D > 0$ 이어야 합니다.<br>$$D = (-3)^2 - 4(3)(1-k) = 9 - 12(1-k) = 12k - 3 > 0$$" },
            { title: "Step 3: k의 범위 도출", text: "$$12k > 3 \\implies k > \\frac{1}{4}$$" }
          ],
          ans: "정답: ③ k > 1/4",
          twins: [

let currentCat = "suneung";
let currentExam = "s2025";

// 카테고리 전환
function switchCategory(cat) {
  currentCat = cat;
  document.querySelectorAll(".cat-tab").forEach(tab => tab.classList.remove("active"));
  event.target.classList.add("active");

  const catData = DB[cat];
  document.getElementById("yearBarLabel").textContent = catData.label + " 연도 선택";

  // 연도 버튼 렌더링
  const container = document.getElementById("yearButtons");
  container.innerHTML = catData.exams.map((ex, idx) => `
    <button class="year-btn ${idx === 0 ? 'active' : ''}" onclick="selectExam('${ex.id}', this)">
      ${ex.name}
      <span class="cnt">${ex.cnt}</span>
    </button>
  `).join("");

  currentExam = catData.exams[0].id;
  renderQuestions();
}

// 시험 연도 선택
function selectExam(examId, btn) {
  currentExam = examId;
  document.querySelectorAll(".year-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderQuestions();
}

  panel.classList.toggle("show");

function toggleDraw(num) {

  area.classList.toggle("show");
  if (area.classList.contains("show")) {
    initDrawCanvas(num);
  }

function initDrawCanvas(num) {
  const canvas = document.getElementById(`canvas-${num}`);
  if (canvas.dataset.inited) return;
  canvas.dataset.inited = "true";
  canvas.width = canvas.parentElement.clientWidth - 30;
  canvas.height = 220;
  const ctx = canvas.getContext("2d");
  ctx.strokeStyle = "#1e3a8a";
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";

  let drawing = false;
  const getPos = e => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return [clientX - rect.left, clientY - rect.top];
  };

  const start = e => { drawing = true; const [x, y] = getPos(e); ctx.beginPath(); ctx.moveTo(x, y); e.preventDefault(); };
  const move = e => { if (!drawing) return; const [x, y] = getPos(e); ctx.lineTo(x, y); ctx.stroke(); e.preventDefault(); };
  const stop = () => { drawing = false; };

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", stop);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", stop);
}

}

// 11번 속도-가속도 애니메이션 시뮬레이터
let sim11Timer = null;
let sim11T = 0;
function initSim11() {
  const canvas = document.getElementById("sim-canvas-11");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  drawSim11(ctx, 0);
}

function drawSim11(ctx, t) {
  const w = ctx.canvas.width;
  const h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);

  // 수직선 축
  ctx.strokeStyle = "#475569";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(40, h / 2);
  ctx.lineTo(w - 40, h / 2);
  ctx.stroke();

  // 눈금
  ctx.fillStyle = "#94a3b8";
  ctx.font = "11px sans-serif";
  for (let x = -10; x <= 10; x += 2) {
    const px = w / 2 + x * 22;
    if (px >= 40 && px <= w - 40) {
      ctx.fillRect(px - 1, h / 2 - 5, 2, 10);
      ctx.fillText(x, px - 6, h / 2 + 20);
    }
  }

  // 위치 x(t) = t^3 - 1.5t^2 - 6t
  const pos = t * t * t - 1.5 * t * t - 6 * t;
  const px = w / 2 + pos * 15;

  // 속도 v(t) = 3t^2 - 3t - 6
  const v = 3 * t * t - 3 * t - 6;

  // 점 P
  ctx.fillStyle = (Math.abs(t - 2) < 0.1) ? "#f43f5e" : "#38bdf8";
  ctx.beginPath();
  ctx.arc(px, h / 2, 9, 0, Math.PI * 2);
  ctx.fill();

  // 속도 벡터 화살표
  if (Math.abs(v) > 0.2) {
    ctx.strokeStyle = "#eab308";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px, h / 2 - 14);
    ctx.lineTo(px + v * 3, h / 2 - 14);
    ctx.stroke();
  }

  // 상태 텍스트
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 13px sans-serif";
  ctx.fillText(`시각 t = ${t.toFixed(2)}s | 위치 x = ${pos.toFixed(1)} | 속도 v = ${v.toFixed(1)}`, 40, 30);
  if (Math.abs(t - 2) < 0.15) {
    ctx.fillStyle = "#fb7185";
    ctx.fillText("★ t = 2.00s : v = 0 (운동 방향 역전! 가속도 a = 9)", 40, 52);
  }
}

function startSim11() {
  if (sim11Timer) clearInterval(sim11Timer);
  sim11T = 0;
  const canvas = document.getElementById("sim-canvas-11");
  const ctx = canvas.getContext("2d");
  sim11Timer = setInterval(() => {
    sim11T += 0.03;
    if (sim11T > 3.2) {
      clearInterval(sim11Timer);
      sim11Timer = null;
    }
    drawSim11(ctx, sim11T);
  }, 30);
}

function resetSim11() {
  if (sim11Timer) clearInterval(sim11Timer);
  sim11T = 0;
  initSim11();
}
